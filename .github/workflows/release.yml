name: Publish release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, such as v1.11.2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/check_project.py --tag "$RELEASE_TAG"
      - name: Require manual dispatch to use the selected tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"

  test:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [preflight, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: zlm-package
          path: dist
      - name: Publish tested package with version notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; preserving published assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --title "ZLM ${RELEASE_TAG#v}" --notes-file "docs/releases/$RELEASE_TAG.md" dist/ZLM-*.zip dist/SHA256SUMS.txt
